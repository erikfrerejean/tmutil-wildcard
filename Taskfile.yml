version: '3'

vars:
  LABEL: com.erikfrerejean.tmutil-wildcard
  COVERAGE_MIN: 90
  BIN:
    sh: echo "$(go env GOPATH)/bin/tmutil-wildcard"
  PLIST:
    sh: echo "$HOME/Library/LaunchAgents/{{.LABEL}}.plist"

tasks:
  test:
    desc: Run vet and the tests; fails when statement coverage drops below COVERAGE_MIN
    cmds:
      - go vet ./...
      - go test -coverprofile=cover.out ./...
      - go tool cover -func=cover.out | awk -v min={{.COVERAGE_MIN}} '{ print } /^total:/ { sub("%", "", $3); if ($3 + 0 < min) { printf "coverage %s%% is below the %s%% floor\n", $3, min; exit 1 } }'

  install:
    desc: Build the binary and (re)load the hourly launch agent
    cmds:
      - go install .
      - sed -e 's|__BIN__|{{.BIN}}|g' -e "s|__HOME__|$HOME|g" launchd/{{.LABEL}}.plist > "{{.PLIST}}"
      - plutil -lint "{{.PLIST}}"
      - launchctl bootout "gui/$(id -u)" "{{.PLIST}}" 2>/dev/null || true
      - launchctl bootstrap "gui/$(id -u)" "{{.PLIST}}"

  uninstall:
    desc: Unload the launch agent and remove the binary
    cmds:
      - launchctl bootout "gui/$(id -u)" "{{.PLIST}}" 2>/dev/null || true
      - rm -f "{{.PLIST}}" "{{.BIN}}"

  run:
    desc: Reconcile exclusions under ~/WeDevelop once, in the foreground
    cmds:
      - go run . exclude "$HOME/WeDevelop"

  list:
    desc: Show the clone folders under ~/WeDevelop the agent targets
    cmds:
      - go run . list "$HOME/WeDevelop"

  excluded:
    desc: Show per folder under ~/WeDevelop whether it is excluded, pending or stale
    cmds:
      - go run . excluded "$HOME/WeDevelop"
